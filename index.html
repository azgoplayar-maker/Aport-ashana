                        </span>
                        <button disabled={!selectedGarnish || !selectedChicken} onClick={addComboToCart} className="bg-[#D4AF37] text-[#1F1410] font-bold px-4 py-2 rounded text-xs disabled:opacity-50">
                          Подносқа қосу ({selectedGarnish && selectedChicken ? selectedGarnish.price + selectedChicken.price : 0}₸)
                        </button>
                      </div>
                    </div>
                  )}

                  {/* PRODUCTS GRID */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    {products.filter(p => p.category === activeCategory).map(product => (
                      <div key={product.id} className="bg-[#2A1B15] border border-[#3D291F] rounded-xl overflow-hidden flex flex-col justify-between">
                        <img src={product.image} alt={product.name} className="h-36 w-full object-cover" />
                        <div className="p-3">
                          <h4 className="font-bold text-sm text-[#F3E5AB]">{product.name}</h4>
                          <p className="text-[11px] text-gray-400 mt-1">{product.description}</p>
                          <div className="flex items-center justify-between mt-3">
                            <span className="font-black text-[#D4AF37]">{product.price}₸</span>
                            <button onClick={() => addToCart(product)} className="bg-[#3D291F] text-[#F3E5AB] px-3 py-1 rounded text-xs font-bold hover:bg-[#D4AF37] hover:text-[#1F1410]">
                              + Қосу
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* SHOPPING TRAY */}
                <aside className={`fixed lg:static inset-y-0 right-0 z-50 w-80 bg-[#180E0A] border-4 border-[#3A2216] p-4 flex flex-col justify-between transition-transform ${isTrayOpen ? 'translate-x-0' : 'translate-x-full lg:translate-x-0'}`}>
                  <div>
                    <div className="flex justify-between items-center pb-2 border-b border-[#3A2216]">
                      <h3 className="font-bold text-[#F3E5AB]">ҚОҢЫР ПОДНОС</h3>
                      <button onClick={() => setIsTrayOpen(false)} className="lg:hidden text-gray-400">✕</button>
                    </div>

                    <div className="mt-4 space-y-2 max-h-[60vh] overflow-y-auto">
                      {cart.length === 0 ? (
                        <p className="text-xs text-center text-gray-500 py-8">Поднос бос</p>
                      ) : (
                        cart.map(item => (
                          <div key={item.cartId} className="bg-[#241611] p-2 rounded border border-[#3A2216] flex justify-between items-center text-xs">
                            <div>
                              <p className="font-bold text-[#F3E5AB]">{item.name}</p>
                              <p className="text-[#D4AF37] font-bold">{item.price * item.quantity}₸</p>
                            </div>
                            <div className="flex items-center space-x-2">
                              <button onClick={() => updateQuantity(item.cartId, -1)} className="px-2 py-0.5 bg-[#180E0A] text-[#D4AF37] font-bold rounded">-</button>
                              <span>{item.quantity}</span>
                              <button onClick={() => updateQuantity(item.cartId, 1)} className="px-2 py-0.5 bg-[#180E0A] text-[#D4AF37] font-bold rounded">+</button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  <div className="pt-3 border-t border-[#3A2216]">
                    <div className="flex justify-between font-bold text-sm mb-3">
                      <span>ЖАЛПЫ:</span>
                      <span className="text-[#F3E5AB]">{cartTotal}₸</span>
                    </div>
                    <button disabled={cart.length === 0} onClick={() => setShowOrderModal(true)} className="w-full bg-[#D4AF37] text-[#1F1410] font-bold py-2.5 rounded-lg text-xs uppercase disabled:opacity-50">
                      ТАПСЫРЫС БЕРУ ❤️
                    </button>
                  </div>
                </aside>
              </main>
            )}

            {/* ORDER FORM MODAL */}
            {showOrderModal && (
              <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                <div className="bg-[#2A1B15] border border-[#3D291F] p-5 rounded-2xl max-w-sm w-full">
                  <h3 className="font-bold text-[#F3E5AB] mb-3">Жеткізу ақпараты</h3>
                  <form onSubmit={handleSendWhatsAppOrder} className="space-y-3 text-xs">
                    <input required placeholder="Аты-жөніңіз" value={orderForm.name} onChange={e => setOrderForm({...orderForm, name: e.target.value})} className="w-full bg-[#1F1410] p-2 rounded border border-[#3D291F] text-white" />
                    <input required placeholder="Телефон нөмірі" value={orderForm.phone} onChange={e => setOrderForm({...orderForm, phone: e.target.value})} className="w-full bg-[#1F1410] p-2 rounded border border-[#3D291F] text-white" />
                    <input required placeholder="Жеткізу мекенжайы" value={orderForm.address} onChange={e => setOrderForm({...orderForm, address: e.target.value})} className="w-full bg-[#1F1410] p-2 rounded border border-[#3D291F] text-white" />
                    <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg mt-2">
                      WhatsApp арқылы жіберу
                    </button>
                    <button type="button" onClick={() => setShowOrderModal(false)} className="w-full text-gray-400 py-1">Жабу</button>
                  </form>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
