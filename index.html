      function AtyrauMap({ branches, selectedBranch, onSelectBranch }) {
        const mapRef = useRef(null);
        const mapInstanceRef = useRef(null);

        useEffect(() => {
          if (!mapRef.current) return;

          if (!mapInstanceRef.current) {
            const map = L.map(mapRef.current, {
              center: [47.1064, 51.9134],
              zoom: 12,
              zoomControl: true
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            mapInstanceRef.current = map;
          }

          const map = mapInstanceRef.current;

          branches.forEach((b) => {
            const isSelected = selectedBranch && selectedBranch.id === b.id;
            
            const customIcon = L.divIcon({
              className: 'custom-map-pin',
              html: `<div style="
                background: ${isSelected ? '#F3E5AB' : '#D4AF37'}; 
                color: #1F1410; 
                width: 32px; 
                height: 32px; 
                border-radius: 50%; 
                display: flex; 
                align-items: center; 
                justify-content: center; 
                font-weight: bold; 
                font-size: 14px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.5);
                border: 2px solid #1F1410;
              ">📍</div>`,
              iconSize: [32, 32],
              iconAnchor: [16, 32]
            });

            const marker = L.marker(b.coords, { icon: customIcon }).addTo(map);
            
            marker.bindPopup(`
              <div style="font-size: 12px; line-height: 1.4;">
                <b style="color: #F3E5AB;">${b.name}</b><br/>
                <span>${b.address}</span><br/>
                <small style="color: #D4AF37;">WhatsApp: ${b.displayPhone}</small>
              </div>
            `);

            marker.on('click', () => {
              onSelectBranch(b);
            });
          });

          if (selectedBranch) {
            map.flyTo(selectedBranch.coords, 14);
          }
        }, [branches, selectedBranch]);

        return (
          <div className="relative w-full h-[320px] sm:h-[400px] rounded-2xl overflow-hidden border-2 border-[#3D291F] shadow-2xl">
            <div ref={mapRef} className="w-full h-full" />
            <div className="absolute top-3 right-3 z-[1000] bg-[#1F1410]/90 backdrop-blur border border-[#3D291F] px-3 py-1.5 rounded-lg text-[11px] text-[#F3E5AB]">
              📍 Атырау қаласы (5 Точка)
            </div>
          </div>
        );

      function App() {
        const [selectedBranch, setSelectedBranch] = useState(() => {
          const saved = localStorage.getItem('aport_selected_branch_v9');
          return saved ? JSON.parse(saved) : null;
        });

        const [products, setProducts] = useState(INITIAL_PRODUCTS);

        const [cart, setCart] = useState(() => {
          const saved = localStorage.getItem('aport_cart_v9');
          return saved ? JSON.parse(saved) : [];
        });

        const [activeCategory, setActiveCategory] = useState('НЕГІЗГІ ТАҒАМДАР');
        const [isTrayOpen, setIsTrayOpen] = useState(false);
        const [showOrderModal, setShowOrderModal] = useState(false);

        const [showAdminModal, setShowAdminModal] = useState(false);
        const [adminBranch, setAdminBranch] = useState(null);
        const [pinInput, setPinInput] = useState('');
        const [isAdminAuthorized, setIsAdminAuthorized] = useState(false);
        const [pinError, setPinError] = useState('');

        const [selectedGarnish, setSelectedGarnish] = useState(null);
        const [selectedChicken, setSelectedChicken] = useState(null);

        const [orderForm, setOrderForm] = useState({
          name: '',
          phone: '',
          address: '',
          orderType: 'delivery',
          comment: ''
        });

        useEffect(() => {
          if (selectedBranch) {
            localStorage.setItem('aport_selected_branch_v9', JSON.stringify(selectedBranch));
          }
        }, [selectedBranch]);

        useEffect(() => {
          localStorage.setItem('aport_cart_v9', JSON.stringify(cart));
        }, [cart]);

        const isProductAvailable = (product) => {
          if (!selectedBranch) return true;
          const status = product.stockStatus ? product.stockStatus[selectedBranch.id] : undefined;
          return status !== false;
        };

        const garnishes = useMemo(() => products.filter(p => p.category === 'ГАРНИРЛЕР' && isProductAvailable(p)), [products, selectedBranch]);
        const chickens = useMemo(() => products.filter(p => p.category === 'ТАУЫҚ ЕТТЕРІ' && isProductAvailable(p)), [products, selectedBranch]);

        const addToCart = (product) => {
          if (!isProductAvailable(product)) return;
          setCart(prev => {
            const existing = prev.find(item => item.cartId === product.id);
            if (existing) {
              return prev.map(item => item.cartId === product.id ? { ...item, quantity: item.quantity + 1 } : item);
            }
            return [...prev, {
              cartId: product.id,
              isCombo: false,
              name: product.name,
              price: product.price,
              image: product.image,
              weight: product.weight,
              quantity: 1
            }];
          });
        };

        const addComboToCart = () => {
          if (!selectedGarnish || !selectedChicken) return;
          const comboId = `combo-${selectedGarnish.id}-${selectedChicken.id}`;
          const comboPrice = selectedGarnish.price + selectedChicken.price;
          const comboName = `${selectedGarnish.name} + ${selectedChicken.name}`;

          setCart(prev => {
            const existing = prev.find(item => item.cartId === comboId);
            if (existing) {
              return prev.map(item => item.cartId === comboId ? { ...item, quantity: item.quantity + 1 } : item);
            }
            return [...prev, {
              cartId: comboId,
              isCombo: true,
              name: comboName,
              garnishName: selectedGarnish.name,
              garnishPrice: selectedGarnish.price,
              chickenName: selectedChicken.name,
              chickenPrice: selectedChicken.price,
              price: comboPrice,
              image: selectedChicken.image,
              quantity: 1
            }];
          });
        };

        const updateQuantity = (cartId, delta) => {
          setCart(prev => prev.map(item => {
            if (item.cartId === cartId) {
              const newQty = item.quantity + delta;
              return newQty > 0 ? { ...item, quantity: newQty } : null;
            }
            return item;
          }).filter(Boolean));
        };

        const cartTotal = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.quantity), 0), [cart]);
        const totalItemCount = useMemo(() => cart.reduce((sum, item) => sum + item.quantity, 0), [cart]);

        const handleSendWhatsAppOrder = (e) => {
          e.preventDefault();
          if (cart.length === 0 || !selectedBranch) return;

          let itemsText = cart.map((item, index) => {
            if (item.isCombo) {
              return `${index + 1}. ${item.name} (${item.quantity}x):\n   - ${item.garnishName} — ${item.garnishPrice}₸\n   - ${item.chickenName} — ${item.chickenPrice}₸\n   - Сомасы: ${item.price * item.quantity}₸`;
            }
            return `${index + 1}. ${item.name} × ${item.quantity} — ${item.price * item.quantity}₸`;

          const message = `Сәлеметсіз бе! ❤️\nAPORT ASHANA-дан ТАПСЫРЫС!\n\n📍 ТАҢДАЛҒАН ТОЧКА:\n${selectedBranch.name}\n(${selectedBranch.address})\n\n👤 Тапсырыс беруші: ${orderForm.name}\n📞 Телефон: ${orderForm.phone}\n🚚 Түрі: ${orderForm.orderType === 'delivery' ? 'Жеткізу' : 'Өзі алып кету'}\n📍 Мекенжай: ${orderForm.orderType === 'delivery' ? orderForm.address : 'Рестораннан алып кетеді'}\n\n🛒 ТАПСЫРЫС ТІЗІМІ:\n${itemsText}\n\n💰 ЖАЛПЫ СОММА: ${cartTotal}₸\n\n📝 Ескертпе: ${orderForm.comment || 'Жоқ'}\n\nAPORT ASHANA ❤️`;

          const targetWhatsAppNumber = selectedBranch.whatsapp;
          window.open(`https://api.whatsapp.com/send?phone=${targetWhatsAppNumber}&text=${encodeURIComponent(message)}`, '_blank');
          setShowOrderModal(false);
        };

        const handleAdminLogin = (e) => {
          e.preventDefault();
          if (!adminBranch) return;
          if (pinInput === adminBranch.pinCode || pinInput === '0000') {
            setIsAdminAuthorized(true);
            setPinError('');
          } else {
            setPinError('Қате PIN-код!');
          }
        };

        const toggleProductStock = (productId) => {
          if (!adminBranch) return;
          setProducts(prev => prev.map(p => {
            if (p.id === productId) {
              const currentStock = p.stockStatus || {};
              const currentStatus = currentStock[adminBranch.id] !== false;
              return {
                ...p,
                stockStatus: {
                  ...currentStock,
                  [adminBranch.id]: !currentStatus
                }
              };
            }
            return p;
          }));
        };

        return (
          <div className="min-h-screen flex flex-col font-sans">
            <header className="sticky top-0 z-40 bg-[#2A1B15]/95 backdrop-blur-md border-b border-[#3D291F] px-4 py-3 shadow-lg">
              <div className="max-w-7xl mx-auto flex items-center justify-between">
                
                {/* LOGO & BRAND AVATAR WITH BACK ARROW BUTTON */}

                        }}

                    </div>
                    <div>
                      <h1 className="font-extrabold text-lg leading-none text-[#F3E5AB] tracking-wide">APORT ASHANA</h1>

                    </div>
                  </div>
                </div>

                {selectedBranch && (

                  >

                    {totalItemCount > 0 && (

            </header>

            {!selectedBranch ? (

                  </span>

                    ФИЛИАЛДЫ ТАҢДАҢЫЗ
                  </h2>
                  <p className="text-xs sm:text-sm text-gray-300 mt-1">

                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {ATYRAU_BRANCHES.map(branch => (
                    <div 
                      key={branch.id} 
                      className="bg-[#2A1B15] border border-[#3D291F] hover:border-[#D4AF37] rounded-xl p-4 flex flex-col justify-between transition-all shadow-md"

                        <p className="text-xs text-gray-300 mt-2 flex items-start">

                        <p className="text-xs text-[#D4AF37] mt-1 font-semibold flex items-center">

                      <div className="grid grid-cols-2 gap-2">

                      onChange={(e) => {
                        const b = ATYRAU_BRANCHES.find(item => item.id === Number(e.target.value));
                        setAdminBranch(b);
                        setIsAdminAuthorized(false);
                        setPinInput('');

                      }}
                      className="w-full bg-[#1F1410] border border-[#3D291F] text-[#F3E5AB] text-xs rounded-lg p-2 font-bold"
                    >
                      {ATYRAU_BRANCHES.map(b => (
                        <option key={b.id} value={b.id}>{b.name}</option>
                      ))}
                    </select>
                  </div>

                  {!isAdminAuthorized ? (
                    <form onSubmit={handleAdminLogin} className="mt-6 max-w-xs mx-auto text-center space-y-3">

                        🔒

                      <p className="text-xs text-gray-300">
                        <strong>{adminBranch?.name}</strong> басқару үшін арнайы PIN-кодты енгізіңіз:
                      </p>
                      {pinError && <p className="text-xs text-rose-400 font-bold">{pinError}</p>}
                      <input
                        type="password"

                        className="w-full bg-[#1F1410] border border-[#3D291F] rounded-lg p-2.5 text-center text-white text-sm font-bold"
                      />
                      <button type="submit" className="w-full bg-[#D4AF37] text-[#1F1410] font-bold py-2 rounded-lg text-xs uppercase">
                        Рұқсат алу
                      </button>
                    </form>
                  ) : (
                    <div className="mt-5 space-y-4">
                      <div className="flex justify-between items-center bg-emerald-950/60 border border-emerald-800 p-2.5 rounded-lg text-xs">
                        <span className="text-emerald-400 font-bold">✓ {adminBranch.name} — Рұқсат берілді</span>
                      </div>

                      <div>
                        <h4 className="text-xs font-bold text-[#D4AF37] uppercase mb-2">
                          Тамақтардың бұл точкада Бар/Жоғын басқару:
                        </h4>
                        <div className="space-y-2 max-h-72 overflow-y-auto pr-1 custom-scrollbar">
                          {products.map(prod => {
                            const isAvail = (prod.stockStatus ? prod.stockStatus[adminBranch.id] : undefined) !== false;
                            return (
                              <div key={prod.id} className="flex items-center justify-between bg-[#1F1410] p-2.5 rounded-lg border border-[#3D291F]">

                                  <p className="text-[10px] text-gray-400">{prod.price}₸</p>
                                </div>

                                <button
                                  onClick={() => toggleProductStock(prod.id)}
                                  className={`px-3 py-1 rounded-md text-xs font-bold transition-all ${
                                    isAvail 
                                      ? 'bg-emerald-700 text-white' 
                                      : 'bg-rose-700 text-white'
                                  }`}
                                >
                                  {isAvail ? 'В наличии (Бар)' : 'Әзірге жоқ (Таусылды)'}
                                </button>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

            <footer className="bg-[#160E0B] border-t border-[#3D291F] py-5 px-4 text-center text-xs text-gray-400 mt-auto">
              <p className="font-bold text-[#F3E5AB]">APORT ASHANA — Атырау қаласы</p>
              <p className="text-[11px] text-gray-400 mt-1">Тапсырыс қабылдау нөмірі: +7 702 648 0887 © 2026</p>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
